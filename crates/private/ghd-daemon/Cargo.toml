[lints]
workspace = true

[package]
name = "ghd-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The ghd daemon: loopback HTTP routes, per-PR cache, ETag sentinels and the batched GraphQL reader."
publish = false

[lib]
name = "ghd_daemon"
doctest = false

[dependencies]
ghd-core = { path = "../ghd-core" }
kernal-api = { workspace = true }
prost = { workspace = true }

# TLS backend per target (kernal-api#427). Linux: rustls, because native TLS
# there is OpenSSL -- openssl-sys needs per-arch target headers, which the
# Dylint cross-target check and the musl release builds do not have. macOS and
# Windows: the platform's own TLS (Security.framework / SChannel), pure-Rust
# FFI with no C build step, so cross-target checks need no C toolchain.
[target.'cfg(target_os = "linux")'.dependencies]
kernal-api = { workspace = true, features = ["http-client-rustls"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
kernal-api = { workspace = true, features = ["http-client"] }
