[build-system]
# soldr is the only PEP 517 backend (ci.toml [python] backend = "soldr",
# ci.yml#6 §13 / PKG-003). maturin is never a build-system requirement of
# this package; it only appears below, as soldr's own dependency
# (`[tool.maturin]` is soldr's config input — soldr drives a pinned
# maturin under the hood, per soldr's README "Use soldr as your PEP 517
# build backend").
requires = ["soldr>=0.9.26"]
build-backend = "soldr"

[project]
name = "ghd"
version = "0.1.0"
description = "Skeleton for a Python package backed by a Rust CLI and PyO3 bindings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Maintainer", email = "maintainer@example.com" }]
dependencies = []

# `ghd-cli` on PATH is the native cargo-built binary itself. The
# soldr PEP 517 backend bundles it straight into the wheel via
# `[tool.soldr.pep517] bundle-bins` below — no post-build injection step
# (ci/build_wheel.py, removed in ci.yml#6 round 1) and no Python wrapper
# in front of it: `cmd → ghd-cli → stdout`. We don't use
# `[project.scripts]` (PEP 621 / wheel console-scripts), because on
# Windows pip generates a Python launcher .exe whose `os.execv` is
# emulated as CreateProcess + parent-exit, racing the shell prompt
# ahead of the child's stdout. See fbuild#747 and
# forge-ci/ghd#2 (items 1 + 10).

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

# ci.yml#6 round-4B (GEN-004): the fast lane runs `ruff check`, `ruff
# format --check` and `pylint` over src/, ci/, tests/, action/ -- this
# section is that config, read with `--config pyproject.toml` (never
# `--isolated`, which would ignore this file too) by ci/gates/ruff.py.
# Deliberately no `line-length`/`target-version` override here: ruff's
# own defaults (88, auto-detected from `requires-python`) are exactly
# what the previous `--isolated` invocation already checked every file
# in this repo against, so leaving them unset keeps this round's diff
# scoped to the one new thing being turned on (`I`, below) instead of
# re-flowing dozens of already-clean files against a different width.
[tool.ruff.lint]
# Default ruff selection (E4, E7, E9, F) plus `I` (isort): a project this
# size gains real value from import-order determinism (many modules mix
# stdlib, third-party and local `ci.*`/`ghd.*`
# imports) at zero cost -- ruff both detects and `--fix`es it.
extend-select = [
    "I",
    # Function-complexity ratchet (zackees/ci.yml#229, PY-004): C901 at
    # ruff's default ceiling (10); an existing offender carries a line-level
    # `# noqa: C901`, and RUF100 flags one that no longer suppresses anything.
    "C901",
    "RUF100",
]

# A `# noqa: S310` names a flake8-bandit rule this config does not select;
# RUF100 must not report it as unused.
external = ["S310"]

[tool.ruff.lint.isort]
known-first-party = ["ghd", "ci"]

# Minimal, itemized pylint configuration -- never `disable = "all"` or a
# check disabled just to reach green. Each entry below is one documented
# decision, not a blanket suppression:
#
#   - `extension-pkg-allow-list`: the PyO3 `_native` extension has no
#     Python source for pylint to parse. Without this, every access
#     (`_native.version_banner_json()`, and transitively anything typed
#     from its return value) is "Uninferable", producing both a direct
#     `c-extension-no-member` (I1101) finding AND a cascading false
#     positive (`unsupported-membership-test` on a `-> str` return,
#     tests/integration/test_installed_end_to_end.py:85) once inference
#     gives up. Allow-listing it makes pylint actually import and
#     introspect the compiled module, which is the standard, documented
#     fix for a C extension (pylint's own message names this option).
#   - `missing-module-docstring` / `missing-class-docstring` /
#     `missing-function-docstring`: this repository's convention
#     (visible throughout `ci/`, `ci/gates/`, `ci/localrun/`) is one
#     thorough module-level docstring explaining the file's behavior,
#     with short, self-describing function bodies underneath (argparse
#     `cmd_*` handlers, one-line dataclasses) -- not per-function/class
#     docstring boilerplate. Real documentation gaps are still caught:
#     `ci-lint precheck` (`GEN-005`-adjacent) and code review, not this
#     tool, own that judgment call.
#   - `wrong-import-position`: the small number of real occurrences
#     (`ci/local.py`, `ci/platform_run.py`, `ci/gates/action_surface.py`,
#     `ci/gates/backend_smoke.py`) each follow a `sys.path.insert(...)`
#     that MUST run before the local import beneath it -- an inline
#     `# pylint: disable=wrong-import-position` sits on each one instead
#     of a project-wide disable here.
#   - `max-line-length` / `max-locals` / `max-branches` /
#     `max-statements` / `max-returns`: calibrated to this codebase's
#     actual measured high-water marks (`pylint src ci tests action`,
#     2026-09, see the round-4B worker report), not pylint's generic
#     defaults -- e.g. `ci/platform_build.py`'s `cmd_stage` (cross-target
#     artifact staging: collect test binaries + CLI + wheel + a JSON
#     manifest in one pass) genuinely needs more locals than a 15-local
#     default assumes. A function that grows past these MEASURED caps is
#     a real complexity finding, not a false one.
#   - `duplicate-code`: `ci/fast.py` and `ci/platform_build.py` (host vs.
#     cross-target build) intentionally duplicate their small
#     `_run`/`_run_isolated_soldr`/`cmd_build_json`-shaped helpers rather
#     than share an import -- documented at the point of duplication
#     (`ci/platform_build.py`'s own docstrings say so: "duplicated rather
#     than imported so this module stays a self-contained, stdlib-only
#     script like every other `ci/*.py` orchestration module in this
#     repo"). Raising `min-similarity-lines` still let a real block
#     through (pylint measures post-normalization tokens, not source
#     lines 1:1); the duplication itself is the deliberate, already-
#     justified design, so the check is disabled here instead of
#     re-justifying the same decision file-by-file with `pylint: disable`
#     comments scattered across every `cmd_*` helper that shares shape
#     with its cross-target twin.
[tool.pylint.main]
extension-pkg-allow-list = ["ghd._native"]

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "duplicate-code",
]

[tool.pylint.format]
max-line-length = 130

[tool.pylint.design]
max-locals = 32
max-branches = 18
max-statements = 60
max-returns = 10

# soldr drives a pinned maturin under the hood; this section is maturin's
# own configuration, consumed by soldr, not a direct maturin invocation
# anywhere in this repo (ci.yml#6 round 1: "maturin only as Soldr's own
# dependency").
[tool.maturin]
manifest-path = "crates/ghd-py/Cargo.toml"
module-name = "ghd._native"
python-source = "src"
features = ["pyo3/extension-module"]
# maturin's sdist only auto-includes the Cargo dependency graph reachable
# from `manifest-path` (crates/{ghd-py,template,private/*}) plus the
# workspace root Cargo.toml/Cargo.lock. Two things a from-sdist build
# needs are outside that graph and must be listed explicitly:
#   - rust-toolchain.toml: not a Cargo input, but soldr refuses to build
#     anything without a repo-pinned toolchain (see its error message).
#   - crates/ghd-cli/**: not a dependency of the _native extension,
#     but `[tool.soldr.pep517] bundle-bins` below needs that package's
#     source to build the bundled binary.
# Caught by "build the wheel FROM the sdist" in local validation
# (zackees/ci.yml#6 round 1) — the plain `uv build` path never exercised
# an actually-isolated sdist extraction, so this was silently broken.
include = [
    "rust-toolchain.toml",
    { path = "crates/ghd-cli/**/*", format = "sdist" },
]

# soldr builds `ghd-cli` with `soldr build --bin` under the same
# target/profile/cache environment as the `_native` extension, then
# stages it into the wheel's `<name>-<ver>.data/scripts/` (pip's raw
# wheel-script install location — see the [project] comment above) with a
# regenerated RECORD. This replaces ci/build_wheel.py's manual
# zipfile-surgery injection. See soldr's README, "A maturin project that
# ships a PyO3 extension and a Cargo [[bin]] in one wheel".
[tool.soldr.pep517]
bundle-bins = [{ bin = "ghd", package = "ghd-cli" }]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["src"]
# `integration` (tests/integration/) is registered so `--strict-markers`
# doesn't error on it, and so it stays an OPT-IN suite: the `unit` suite
# invocation runs `-m "not integration"`; the `integration` suite
# invocation runs `-m integration tests/integration` explicitly. See
# tests/integration/README.md and zackees/ci.yml#6 round 3.
markers = [
    "integration: end-to-end tests against the installed package + native CLI (ci.toml [suites].integration; opt-in, see tests/integration/README.md)",
]

# Re-sync the editable install when these files change. Default uv
# only watches pyproject.toml, so editable installs silently leave a
# stale `_native.pyd` after .rs edits — `uv run` would then execute
# against pre-edit Rust code with no visible warning. The globs trigger
# re-sync on real source changes. Correctness, not raw speed, but the
# fast iteration loop depends on it. See fbuild#661 / #2 item (7).
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust-toolchain.toml" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.toml" },
]
# NOTE on `no-build-isolation-package`: fbuild disables PEP 517
# isolation so its setup.py-based mtime-skip can see the staged binary
# across `pip install` invocations. The soldr backend doesn't fit that
# pattern cleanly — disabling isolation breaks the build env's automatic
# soldr install (uv reuses a build env without soldr, and uv's preview
# `extra-build-dependencies` mechanism is fragile here). soldr already
# caches by content hash under its own root (see soldr's README, "soldr
# also caches the last successful wheel"), giving the incremental win
# without needing to touch isolation, so we leave isolation on. See
# forge-ci/ghd#2 (item 5) — we may revisit if the
# soldr/uv combo grows a clean no-isolation story.
