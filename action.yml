name: "ghd"
description: >-
  Composite action that installs the `ghd` binary shipped with
  the ghd Python package, then exposes it on PATH
  for downstream steps. Pair with `./cleanup` for a clean
  post-job state.

branding:
  icon: "package"
  color: "purple"

inputs:
  version:
    description: >-
      Version of the ghd Python package to install.
      Defaults to the version declared in pyproject.toml of the consuming
      repo (resolved by uv).
    required: false
    default: ""
  python-version:
    description: >-
      Python version uv should provision the install venv with.
      Defaults to a recent CPython compatible with the package's
      requires-python lower bound.
    required: false
    default: "3.11"

outputs:
  binary-path:
    description: >-
      Absolute path to the installed `ghd` binary.
    value: ${{ steps.expose.outputs.binary-path }}

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
        # This composite runs in an ARBITRARY consuming repo's CI (it
        # installs the released ghd binary via `uv tool
        # install`), never in this repo's own precheck-planned jobs, so
        # there is no `needs.precheck.outputs.cache_save` to bind to
        # here (ci.toml's `[allow].setup-uv.require.save-cache = "plan"`
        # only governs THIS repo's own workflows). Restore-only: this
        # action never persists a durable cache entry into whatever
        # consumer repo runs it (CACHE-003 -- missing/literal "true"
        # both save unconditionally; explicit "false" does not).
        save-cache: false

    - name: Provision Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Install ghd via uv tool
      shell: bash
      run: python3 ${{ github.action_path }}/action/install_cli.py "${{ inputs.version }}"

    - name: Expose binary path
      id: expose
      shell: bash
      run: python3 ${{ github.action_path }}/action/expose_binary.py

    - name: Smoke-test the surface
      shell: bash
      run: python3 ${{ github.action_path }}/action/smoke_test.py
