# Shared CI tool consumer: protocol implementation lives in zackees/ci.yml.
# Every lane is `ci/local_gate.py --lane <id>`: `precheck` and `fast` replay
# their ci.yml job under Bosn -> act2; `lint` runs `soldr lint` on the host.
# Lint never runs under Bosn (no dylint/clippy/fmt job replay), so there is
# no whole-workflow `[gate.full-run]` shortcut either: it would replay the
# `dylint` job in a container.
[gate]
run = ["uv", "run", "--no-project", "--python", "3.13", "python", "ci/local_gate.py"]
verify = "ci.yml:verify"
mode = "shadow"

[gate.lanes.precheck]
run = ["uv", "run", "--no-project", "--python", "3.13", "python", "ci/local_gate.py", "--lane", "precheck"]
tools = ["bosn", "docker", "uv", "python"]

[gate.lanes.fast]
run = ["uv", "run", "--no-project", "--python", "3.13", "python", "ci/local_gate.py", "--lane", "fast"]
tools = ["bosn", "docker", "uv", "python"]

# Host `soldr lint` (ci/local_gate.py): rustfmt check, Clippy on the host and
# every `[workspace.metadata.soldr].targets` triple, and every Dylint library
# in `[workspace.metadata.dylint]`; `--cross-dylint` repeats the Dylint pass
# per declared cross target, which is what the remote `ci.yml:dylint` job
# (ci/dylint.py multi-target) covers.
[gate.lanes.lint]
run = ["uv", "run", "--no-project", "--python", "3.13", "python", "ci/local_gate.py", "--lane", "lint"]
tools = ["soldr", "uv"]

[gate.replay]
repository = "forge-ci/ghd"
workflow = "ci.yml"
mode = "minimal"
report-source = "stdout"
qualified = true
provider-query = ["bosn", "ci", "runners", "list", "--json"]

[[gate.replay.selections]]
lane = "precheck"
job = "precheck"
event = "pull_request"

[[gate.replay.selections]]
lane = "fast"
job = "fast"
event = "pull_request"

[[gate.replay.jobs]]
source-job = "ci.yml:verify"
capture-outputs = ["skip_fast"]
lanes = ["precheck", "fast"]

[[gate.replay.jobs]]
source-job = "ci-pre.yml:precheck"
capture-outputs = ["cache_save", "fast_reused", "fast_suites_json"]
lanes = ["precheck", "fast"]

[[gate.replay.jobs]]
source-job = "ci-pre.yml:cache-budget"
lanes = ["precheck", "fast"]

[[gate.replay.jobs]]
source-job = "ci-pre.yml:cache-janitor"
lanes = ["precheck", "fast"]

[[gate.replay.jobs]]
source-job = "ci.yml:cache-maint"
lanes = ["fast"]

[[gate.replay.jobs]]
source-job = "ci.yml:reuse-decision"
lanes = ["fast"]

[[gate.replay.jobs]]
source-job = "ci.yml:pool"
lanes = ["fast"]

[[gate.replay.jobs]]
source-job = "ci.yml:fast"
lanes = ["fast"]

[gate.trust]
mode = "enforce"
skip = ["ci.yml:fast", "ci.yml:dylint"]
covered-by = { "ci.yml:fast" = ["fast"], "ci.yml:dylint" = ["lint"] }
surfaces = ["ci/**"]
audit-rate = 10
full-labels = ["ci-cache-save", "ci-full", "ci-linux", "ci-linux-arm64", "ci-linux-arm64-musl", "ci-linux-x64", "ci-linux-x64-musl", "ci-macos", "ci-macos-arm64", "ci-macos-x64", "ci-perf", "ci-perf-linux", "ci-perf-macos", "ci-perf-windows", "ci-test", "ci-test-init", "ci-test-integration", "ci-test-perf", "ci-test-smoke", "ci-test-unit", "ci-windows", "ci-windows-arm64", "ci-windows-x64", "ci:full", "no-test", "no-test-init", "no-test-integration", "no-test-perf", "no-test-smoke", "no-test-unit", "release"]
